<!DOCTYPE html>
<html lang="ja">
<head>
<base target="_top">
<script>
/* デモ用の疑似サーバー（google.script.run の代わり）。データはすべて架空のサンプルです。 */
(function(){
  var PL = ['instagram','youtube','x','tiktok'];
  function seed(n){ var s = n; return function(){ s = (s * 9301 + 49297) % 233280; return s / 233280; }; }
  var DEF = [
    ['c_fuji','有限会社藤電設工業','電気設備工事','採用（20代の電気工事士）と地域での認知','IG フォロワー 月+50 / YouTube 月間再生 1万回 / 採用ページ遷移 月30件'],
    ['c_yama','山田精機株式会社','精密部品加工','技術力の発信で新規取引の問い合わせを増やす','YouTube 月間再生 2万回 / 問い合わせ 月3件'],
    ['c_toho','東邦金属工業','板金・溶接','若手採用と職人の魅力発信','TikTok 月間再生 5万回 / 応募 月2件'],
    ['c_kita','北村樹脂成形','樹脂成形','BtoB の認知拡大','IG フォロワー 月+40'],
    ['c_sanw','三和塗装','工業塗装','採用と地域認知','IG フォロワー 月+30 / TikTok 月間再生 3万回'],
    ['c_naka','中央ボルト製作所','ねじ・締結部品','展示会集客と指名検索','X インプレッション 月5万 / YouTube 月間再生 8千回'],
    ['c_aoba','青葉機工','産業機械メンテナンス','採用（未経験者）','TikTok 月間再生 4万回 / 応募 月2件']
  ];
  var clients = DEF.map(function(d, i){ return { id:d[0], name:d[1], industry:d[2], goal:d[3], kpi:d[4], tone:'丁寧・前向き・数字重視', notes:'', active:true,
    ig_user_id:'1784140000000000' + i, yt_channel_id:'@sample' + i, x_username: i % 3 === 2 ? '' : 'sample' + i }; });

  function platforms(i){
    var r = seed(i + 7), out = {};
    PL.forEach(function(p, k){
      if(p === 'x' && !clients[i].x_username) return;
      var base = [1200, 800, 1500, 900][k] * (0.6 + r());
      var g = Math.round((r() - 0.25) * 90);
      out[p] = { followersEnd: Math.round(base), followerGrowth: g, followersStart: Math.round(base) - g,
        views: Math.round((p === 'youtube' ? 18000 : p === 'tiktok' ? 30000 : 9000) * (0.5 + r())),
        postsPublished: Math.round(4 + r() * 10), engagementRate: Math.round((1 + r() * 6) * 100) / 100,
        change: { followers: Math.round((r() - 0.3) * 80) / 10, views: Math.round((r() - 0.4) * 400) / 10 } };
      var aud = audienceFor(i, p, k);
      if(aud) out[p].audience = aud;
    });
    return out;
  }
  function pctMap(keys, weights, r){ var raw = keys.map(function(k, j){ return weights[j] * (0.7 + r() * 0.6); });
    var t = raw.reduce(function(a, b){ return a + b; }, 0), o = {}; keys.forEach(function(k, j){ o[k] = Math.round(raw[j] / t * 1000) / 10; }); return o; }
  var AGEK = ['13-17','18-24','25-34','35-44','45-54','55-64','65+'];
  function audienceFor(i, p, seedOffset){
    var r = seed(i * 31 + seedOffset), young = p === 'tiktok' ? 2.2 : p === 'instagram' ? 1.4 : 0.8;
    var age = pctMap(AGEK, [3 * young, 20 * young, 30, 22, 14, 7, 4], r);
    var gender = pctMap(['female','male','unknown'], [p === 'instagram' ? 42 : 25, 70, 3], r);
    var follow = pctMap(['follower','non_follower'], [p === 'tiktok' ? 20 : 45, 55], r);
    var m = new Date(); var month = m.getFullYear() + '-' + String(m.getMonth()+1).padStart(2,'0');
    if(p === 'instagram') return { month:month, followers:{ age:age, gender:gender }, viewers:{ follow:follow }, engaged:{ age:pctMap(AGEK, [2, 26, 34, 20, 10, 5, 3], r), gender:pctMap(['female','male','unknown'], [45, 52, 3], r) } };
    if(p === 'youtube') return { month:month, viewers:{ age:age, gender:gender, follow:follow } };
    if(p === 'tiktok' && i % 2 === 0) return { month:month, viewers:{ age:age, gender:gender, follow:follow } };
    return null;
  }
  function summary(pl){ var s = {followersEnd:0,followerGrowth:0,views:0,postsPublished:0};
    Object.keys(pl).forEach(function(p){ s.followersEnd += pl[p].followersEnd; s.followerGrowth += pl[p].followerGrowth; s.views += pl[p].views; s.postsPublished += pl[p].postsPublished; }); return s; }
  function series(i){ var pl = platforms(i), s = {}, r = seed(i + 99);
    Object.keys(pl).forEach(function(p){ var v = pl[p].followersEnd - pl[p].followerGrowth * 4; s[p] = [];
      for(var d = 119; d >= 0; d--){ var dt = new Date(Date.now() - d * 86400000); v += pl[p].followerGrowth / 30 + (r() - 0.5) * 3; s[p].push({ date: dt.toISOString().slice(0,10), followers: Math.round(v) }); } });
    return s; }
  var TITLES = ['朝礼から始まる現場の一日','新人が初めて任された仕事','職人の手元アップ 30 秒','工場見学ツアー','社長が語る創業のきっかけ','失敗から学んだ安全対策','完成した製品ができるまで','先輩社員インタビュー'];
  function postsFor(i){ var r = seed(i + 3), out = [];
    for(var k = 0; k < 14; k++){ var p = PL[k % 4]; if(p === 'x' && !clients[i].x_username) p = 'instagram';
      var dt = new Date(Date.now() - k * 2.3 * 86400000);
      out.push({ postId:'p' + i + '_' + k, platform:p, publishedAt: dt.toISOString(), title: TITLES[(k + i) % TITLES.length], url:'https://example.com/post/' + i + '-' + k,
        views: Math.round(500 + r() * 8000), likes: Math.round(20 + r() * 400), comments: Math.round(r() * 30), shares: Math.round(r() * 25), saves: Math.round(r() * 40) }); }
    return out; }
  function monthJa(m){ return m.slice(0,4) + '年' + Number(m.slice(5,7)) + '月'; }
  function sampleReport(c, month, pl){
    var rows = Object.keys(pl).map(function(p){ var x = pl[p]; var L = {instagram:'Instagram',youtube:'YouTube',x:'X',tiktok:'TikTok'}[p];
      return '| ' + L + ' | ' + x.followersEnd.toLocaleString() + '（' + (x.followerGrowth >= 0 ? '+' : '') + x.followerGrowth + '） | ' + x.views.toLocaleString() + ' | ' + x.postsPublished + ' | ' + x.engagementRate + '% |'; }).join('\n');
    var ig = pl.instagram || {followerGrowth:0, change:{}};
    var igA = (pl.instagram && pl.instagram.audience) || {}; ig = Object.assign({}, ig, { followers: igA.followers, viewers: igA.viewers });
    return '# ' + c.name + ' 様 SNS 運用レポート（' + monthJa(month) + '）\n\n' +
      '## 1. 今月のハイライト\n- Instagram のフォロワーが **' + (ig.followerGrowth >= 0 ? '+' : '') + ig.followerGrowth + ' 人**（前月比 ' + ig.change.followers + '%）と、職人の手元動画を起点に増加しました。\n- TikTok は「新人が初めて任された仕事」が今月最多の再生となり、採用ページへの導線が機能し始めています。\n- 一方で YouTube の長尺動画は再生が伸び悩んでおり、来月はショート動画への切り出しで補います。\n\n' +
      '## 2. KPI 達成状況\n| 指標 | 目標 | 実績 | 前月比 | 判定 |\n|---|---|---|---|---|\n| Instagram フォロワー増 | +50 | ' + ig.followerGrowth + ' | ' + ig.change.followers + '% | ' + (ig.followerGrowth >= 50 ? '◎' : ig.followerGrowth >= 30 ? '○' : '△') + ' |\n| YouTube 月間再生 | 10,000 | ' + (pl.youtube ? pl.youtube.views.toLocaleString() : 'データ未取得') + ' | ' + (pl.youtube ? pl.youtube.change.views + '%' : '—') + ' | ○ |\n| 採用ページ遷移 | 30 | データ未取得 | — | — |\n\n' +
      '## 3. 媒体別の結果\n| 媒体 | フォロワー（増減） | 再生・表示 | 投稿数 | ER |\n|---|---|---|---|---|\n' + rows + '\n\n所見：現場の「人」が映る投稿ほど保存・シェアが多く、製品単体の紹介は反応が控えめでした。\n\n' +
      '## 4. 見ている人の属性\n- **Instagram**：フォロワーの中心は 25〜34 歳（' + (ig.followers ? ig.followers.age['25-34'] : '—') + '%）。閲覧の ' + (ig.viewers ? ig.viewers.follow.non_follower : '—') + '% がフォロワー外からで、新しい人に届いています。\n- **YouTube**：視聴者は 35〜44 歳と男性が中心で、取引先・業界関係者に近い層です。\n- **TikTok**：18〜24 歳の比率が最も高く、採用ターゲットに届いています。\n- **X**：属性データ未取得\n\n' +
      '## 5. 反応が良かった投稿 TOP3 と要因\n1. **新人が初めて任された仕事**（TikTok）— 冒頭 2 秒で結末を見せる構成が離脱を防いだと考えられます。\n2. **職人の手元アップ 30 秒**（Instagram リール）— 音と手元のみのシンプルな構成で保存数が多く出ました。\n3. **工場見学ツアー**（YouTube ショート）— 平日 12 時台の投稿で初速が伸びました。\n\n' +
      '## 6. 課題と原因の仮説\n- YouTube 長尺の視聴が伸びない → 冒頭の説明が長く、最初の 30 秒で離脱している可能性（仮説）。\n- X はインプレッションに対して反応率が低い → 文字だけの投稿が多く、画像付きが少ないため。\n\n' +
      '## 7. 来月の打ち手\n- **長尺動画のショート化**：狙い＝新規視聴者の獲得 / やること＝既存 3 本から 60 秒以内を 6 本切り出し / 期待＝ショート再生 +30%\n- **「先輩社員」シリーズ化**：狙い＝採用ページ遷移 / やること＝毎週木曜に 1 本 / 期待＝遷移 月30件\n- **X は画像付き投稿に統一**：狙い＝反応率改善 / 期待＝ER 1.5% → 2.5%\n\n' +
      '## 8. 担当者からのひとこと\n現場の皆さまの協力のおかげで「人が見える発信」が定着してきました。来月はこの流れを採用につなげることに集中します。引き続きよろしくお願いいたします。\n\n> ※これはデモ用のサンプルです。実際のレポートは取得したデータと固定指示から AI が作成します。';
  }
  var reports = {};
  var settings = { agencyName:'株式会社Cc', claudeModel:'claude-opus-5-5', openaiModel:'gpt-5', defaultEngine:'claude+gpt', autoMonthlyReport:true, notifyEmail:'',
    reportInstruction:'あなたは製造業クライアント専門の SNS 運用代理店のシニアアカウントプランナーです。\n以下の「クライアント情報」と「月次データ(JSON)」だけを根拠に、クライアントへそのまま提出できる月次レポートを日本語の Markdown で作成してください。\n\n# 構成（この順番・見出し名で出力）\n## 1. 今月のハイライト\n## 2. KPI 達成状況\n## 3. 媒体別の結果\n## 4. 見ている人の属性\n## 5. 反応が良かった投稿 TOP3 と要因\n## 6. 課題と原因の仮説\n## 7. 来月の打ち手\n## 8. 担当者からのひとこと\n\n# ルール\n- 数値は必ずデータにあるものだけを使う。\n- 前月データがある指標は必ず前月比（%）を併記する。\n- 製造業の担当者にも伝わる平易な言葉を使う。',
    keys:{ANTHROPIC_API_KEY:true,OPENAI_API_KEY:true,META_ACCESS_TOKEN:true,YOUTUBE_API_KEY:true,X_BEARER_TOKEN:false,TIKTOK_CLIENT_KEY:true,TIKTOK_CLIENT_SECRET:true,GOOGLE_OAUTH_CLIENT_ID:true,GOOGLE_OAUTH_CLIENT_SECRET:true},
    redirectUri:'https://script.google.com/macros/s/（デプロイ後に表示されます）/exec' };
  function idx(id){ for(var i = 0; i < clients.length; i++) if(clients[i].id === id) return i; return 0; }
  function prevMonth(m){ var y = +m.slice(0,4), mo = +m.slice(5,7) - 1; if(!mo){ y--; mo = 12; } return y + '-' + String(mo).padStart(2,'0'); }
  var api = {
    apiLogin: function(p){ if(!p) throw new Error('パスワードを入力してください'); return { token:'demo' }; },
    apiBootstrap: function(){ var m = new Date(); var month = m.getFullYear() + '-' + String(m.getMonth()+1).padStart(2,'0');
      return { month: month, jobs:{}, settings: settings, clients: clients.map(function(c, i){ var pl = platforms(i);
        return { client:c, tiktokLinked: i !== 3, summary: summary(pl), platforms: pl, lastFetchedAt: new Date().toISOString().slice(0,10) + 'T06:0' + i + ':00' }; }) }; },
    apiClientDetail: function(id, month){ var i = idx(id), pl = platforms(i);
      if(!reports[id]) reports[id] = [{ month: prevMonth(month), engine:'claude+gpt', createdAt: new Date().toISOString().slice(0,10) + 'T08:03:00', docUrl:'https://docs.google.com/', markdown: sampleReport(clients[i], prevMonth(month), pl) }];
      var posts = postsFor(i), pa = {};
      posts.forEach(function(p, k){ if(p.platform === 'youtube'){ var a = audienceFor(i, 'youtube', 50 + k); a.viewers.age = Object.assign({}, a.viewers.age); pa['youtube|' + p.postId] = a; } });
      return { client: clients[i], tiktokLinked: i !== 3, googleLinked: i % 3 !== 1, postAudience: pa, monthly:{ month:month, prevMonth:prevMonth(month), summary:summary(pl), platforms:pl }, series: series(i), recentPosts: posts, reports: reports[id] }; },
    apiGenerateReport: function(id, month, engine){ var i = idx(id); var r = { month:month, engine:engine, createdAt:new Date().toISOString().slice(0,19), docUrl:'https://docs.google.com/', markdown: sampleReport(clients[i], month, platforms(i)) };
      reports[id] = [r].concat(reports[id] || []); return r; },
    apiAsk: function(id, month, q){ return '**デモ回答**（実際は Claude / ChatGPT がこの会社のデータをもとに回答します）\n\n質問：' + q + '\n\n- 反応が良い「人が映る投稿」を週 2 本に増やす\n- YouTube 長尺は 60 秒以内のショートに切り出す\n- 投稿時間は平日 12 時台に寄せる'; },
    apiManualAudience: function(){ return 10; },
    apiGoogleAuthUrl: function(){ throw new Error('デモ版では YouTube 詳細分析の連携は動きません（本番では Google のログイン画面が開きます）'); },
    apiCollect: function(){ return { instagram:'ok', youtube:'ok', x:'skip', tiktok:'ok' }; },
    apiCollectAll: function(){ return {}; },
    apiSaveClient: function(o){ if(o.id){ var i = idx(o.id); Object.keys(o).forEach(function(k){ clients[i][k] = o[k]; }); return clients[i]; }
      o.id = 'c_new' + clients.length; clients.push(o); return o; },
    apiDeleteClient: function(id){ clients.splice(idx(id), 1); return true; },
    apiSaveSettings: function(p){ Object.keys(p).forEach(function(k){ settings[k] = p[k]; }); return settings; },
    apiSaveSecret: function(k, v){ settings.keys[k] = !!v; return settings; },
    apiTestAi: function(){ return '接続OK（デモ）'; },
    apiTikTokAuthUrl: function(){ throw new Error('デモ版では TikTok 連携は動きません（本番では TikTok のログイン画面が開きます）'); },
    apiLogs: function(){ return [{ at:new Date().toISOString().slice(0,19), level:'info', scope:'job:collect', message:'完了 7 件（デモ）' }]; },
    apiChangePassword: function(){ return true; }
  };
  function runner(){
    var ok = function(){}, ng = function(){}, P;
    var o = { withSuccessHandler:function(f){ ok = f; return P; }, withFailureHandler:function(f){ ng = f; return P; } };
    P = new Proxy(o, { get:function(t, k){ if(k in t) return t[k];
      return function(){ var a = Array.prototype.slice.call(arguments); if(k !== 'apiLogin') a.shift();
        setTimeout(function(){ try{ ok(api[k] ? api[k].apply(null, a) : true); }catch(e){ ng(e); } }, k === 'apiGenerateReport' ? 1200 : 250); }; } });
    return P;
  }
  window.google = { script: { run: new Proxy({}, { get:function(_, k){ return runner()[k]; } }) } };
  // 埋め込み表示では確認ダイアログが出ないため、デモでは常に「はい」として扱う
  window.confirm = function(){ return true; };
})();

</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cc SNS Hub デモ</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#F5F6F8;--panel:#FFFFFF;--panel-2:#F0F2F5;--line:#E2E5EA;--ink:#1C2430;--ink-2:#5B6574;--ink-3:#8A93A0;
    --accent:#2754C5;--accent-2:#E8EEFB;--good:#1E8E5A;--bad:#C2410C;--warn:#B7791F;
    --ig:#C13584;--s1:#2754C5;--s2:#C27A1E;--s3:#A0A8B4;--yt:#E02424;--x:#111827;--tt:#00A3B4;
    --radius:10px;--shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0F141B;--panel:#161D26;--panel-2:#1C2531;--line:#2A3442;--ink:#E7ECF2;--ink-2:#A7B1BE;--ink-3:#7A8594;
      --accent:#6E95F5;--accent-2:#1D2A44;--good:#3DBE82;--bad:#F07B4A;--warn:#E3B04B;--x:#E7ECF2;
      --s1:#5B83E8;--s2:#C27F2C;--s3:#4A5563;--shadow:none;color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0F141B;--panel:#161D26;--panel-2:#1C2531;--line:#2A3442;--ink:#E7ECF2;--ink-2:#A7B1BE;--ink-3:#7A8594;
    --accent:#6E95F5;--accent-2:#1D2A44;--good:#3DBE82;--bad:#F07B4A;--warn:#E3B04B;--x:#E7ECF2;
    --s1:#5B83E8;--s2:#C27F2C;--s3:#4A5563;--shadow:none;color-scheme:dark;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:'Noto Sans JP',system-ui,sans-serif;font-size:14px;line-height:1.6}
  button,input,select,textarea{font:inherit;color:inherit}
  a{color:var(--accent)}
  .hidden{display:none!important}

  /* login */
  .login{min-height:100vh;display:grid;place-items:center;padding:16px}
  .login-card{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:32px;box-shadow:var(--shadow)}
  .login-card h1{font-size:20px;margin-bottom:4px}
  .login-card p{color:var(--ink-2);font-size:13px;margin-bottom:20px}

  /* layout */
  header{position:sticky;top:0;z-index:10;background:var(--panel);border-bottom:1px solid var(--line)}
  .bar{max-width:1200px;margin:auto;display:flex;align-items:center;gap:12px;padding:12px 16px;flex-wrap:wrap}
  .logo{font-weight:700;font-size:16px;cursor:pointer}
  .logo span{color:var(--accent)}
  .spacer{flex:1}
  main{max-width:1200px;margin:auto;padding:20px 16px 60px}

  .btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 14px;cursor:pointer;white-space:nowrap}
  .btn:hover{border-color:var(--ink-3)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.small{padding:4px 10px;font-size:12px}
  .btn.danger{color:var(--bad)}
  .btn:disabled{opacity:.5;cursor:wait}
  input,select,textarea{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
  textarea{min-height:90px;resize:vertical}
  label{display:block;font-size:12px;color:var(--ink-2);margin:10px 0 4px}
  .row{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);margin-bottom:16px}
  .panel h2{font-size:15px;margin-bottom:12px}
  .muted{color:var(--ink-2)}
  .small{font-size:12px}

  .tiles{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:16px}
  .tile{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}
  .tile .k{font-size:12px;color:var(--ink-2)}
  .tile .v{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
  .tile .d{font-size:12px}
  .up{color:var(--good)}.down{color:var(--bad)}

  .cards{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;cursor:pointer;box-shadow:var(--shadow);transition:border-color .15s}
  .card:hover{border-color:var(--accent)}
  .card h3{font-size:15px;margin-bottom:2px}
  .plats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}
  .plat{background:var(--panel-2);border-radius:8px;padding:6px 8px}
  .plat .n{font-weight:700;font-variant-numeric:tabular-nums}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
  .dot.instagram{background:var(--ig)}.dot.youtube{background:var(--yt)}.dot.x{background:var(--x)}.dot.tiktok{background:var(--tt)}

  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
  .tab{padding:8px 14px;border:none;background:none;cursor:pointer;color:var(--ink-2);border-bottom:2px solid transparent;white-space:nowrap}
  .tab.active{color:var(--ink);border-bottom-color:var(--accent);font-weight:500}

  .tbl-wrap{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--ink-2);font-weight:500;background:var(--panel-2)}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}

  .md{line-height:1.8}
  .md h1{font-size:20px;margin:6px 0 12px}
  .md h2{font-size:16px;margin:22px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--line)}
  .md h3{font-size:14px;margin:14px 0 6px}
  .md p,.md ul,.md ol{margin:6px 0}
  .md ul,.md ol{padding-left:22px}
  .md table{margin:8px 0}
  .md blockquote{color:var(--ink-2);border-left:3px solid var(--line);padding-left:10px}

  .badge{display:inline-block;font-size:11px;padding:1px 8px;border-radius:999px;background:var(--accent-2);color:var(--accent)}
  .badge.ok{background:rgba(30,142,90,.12);color:var(--good)}
  .badge.ng{background:rgba(194,65,12,.12);color:var(--bad)}

  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:8px;z-index:100;max-width:90vw}
  .toast.err{background:var(--bad);color:#fff}
  .overlay{position:fixed;inset:0;background:rgba(15,20,27,.35);display:grid;place-items:center;z-index:90}
  .overlay .box{background:var(--panel);padding:20px 26px;border-radius:12px;border:1px solid var(--line);text-align:center}
  .spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:s 1s linear infinite;margin:0 auto 10px}
  @keyframes s{to{transform:rotate(360deg)}}
  .secret{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:8px 14px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
  .secret-in{display:flex;gap:8px}
  .secret-name .badge{margin-left:4px}
  .aud-grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
  .aud-card{min-width:0}
  .aud-card h3{font-size:13px;margin-bottom:8px}
  .hbar{display:grid;grid-template-columns:52px minmax(0,1fr) 44px;gap:8px;align-items:center;font-size:12px;margin:3px 0}
  .hbar .track{height:12px;border-radius:0 4px 4px 0;background:var(--panel-2)}
  .hbar .fill{height:100%;background:var(--s1);border-radius:0 4px 4px 0;min-width:2px}
  .hbar .pct{text-align:right;font-variant-numeric:tabular-nums}
  .stack{display:flex;gap:2px;height:16px;margin:4px 0 6px}
  .stack span{display:block;height:100%;min-width:2px}
  .stack span:first-child{border-radius:4px 0 0 4px}.stack span:last-child{border-radius:0 4px 4px 0}
  .legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--ink-2)}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
  .aud-sub{font-size:12px;color:var(--ink-2);margin:12px 0 2px}
  tr.aud-row td{background:var(--panel-2)}
  .tbl-wrap .posts-tbl{min-width:720px}
  .posts-tbl td.title{min-width:180px}
  .aud-inner{max-width:min(440px,calc(100vw - 72px));position:sticky;left:0}
  .chart-box{position:relative;height:260px}
  @media (max-width:600px){ .secret{grid-template-columns:1fr} .plats{grid-template-columns:repeat(2,1fr)} .tile .v{font-size:20px} }
  .demo-banner{background:var(--accent-2);color:var(--accent);font-size:12px;padding:6px 16px;text-align:center}
</style>
</head>
<body>
<div class="demo-banner">デモ版：表示されている会社名・数値・レポートはすべて架空のサンプルです。パスワードは何を入れてもログインできます。</div>

<!-- ログイン -->
<section id="loginView" class="login">
  <div class="login-card">
    <h1>Cc SNS Hub</h1>
    <p>Cc 社内専用です。共通パスワードを入力してください。</p>
    <form id="loginForm">
      <input type="password" id="pass" placeholder="パスワード" autocomplete="current-password" required>
      <button class="btn primary" style="width:100%;margin-top:12px" type="submit">ログイン</button>
      <p id="loginErr" class="small" style="color:var(--bad);margin:10px 0 0"></p>
    </form>
  </div>
</section>

<!-- アプリ -->
<div id="appView" class="hidden">
  <header>
    <div class="bar">
      <div class="logo" onclick="go('dashboard')">Cc <span>SNS Hub</span></div>
      <div class="spacer"></div>
      <input type="month" id="monthSel" style="width:auto">
      <button class="btn" onclick="collectAll()">全社データ取得</button>
      <button class="btn" onclick="go('settings')">設定</button>
      <button class="btn" onclick="logout()">ログアウト</button>
    </div>
  </header>
  <main id="main"></main>
</div>

<div id="overlay" class="overlay hidden"><div class="box"><div class="spin"></div><div id="overlayMsg">処理中…</div></div></div>

<script>
/* ================= 基本 ================= */
var PL = ['instagram','youtube','x','tiktok'];
var PL_LABEL = {instagram:'Instagram',youtube:'YouTube',x:'X',tiktok:'TikTok'};
var S = { token:null, boot:null, view:'dashboard', clientId:null, detail:null, tab:'overview', chart:null };

function store(k, v){ try{ if(v===undefined) return sessionStorage.getItem(k); if(v===null) sessionStorage.removeItem(k); else sessionStorage.setItem(k, v); }catch(e){ return null; } }

/** google.script.run を Promise 化（トークン自動付与・セッション切れ処理） */
function api(fn){
  var args = Array.prototype.slice.call(arguments, 1);
  return new Promise(function(resolve, reject){
    var r = google.script.run.withSuccessHandler(resolve).withFailureHandler(function(e){
      var msg = (e && e.message) || String(e);
      if(msg.indexOf('SESSION_EXPIRED') >= 0){ showLogin('セッションの有効期限が切れました。再ログインしてください。'); }
      reject(new Error(msg));
    });
    r[fn].apply(r, fn === 'apiLogin' ? args : [S.token].concat(args));
  });
}

function busy(msg){ document.getElementById('overlayMsg').textContent = msg || '処理中…'; document.getElementById('overlay').classList.remove('hidden'); }
function idle(){ document.getElementById('overlay').classList.add('hidden'); }
function toast(msg, err){
  var t = document.createElement('div'); t.className = 'toast' + (err ? ' err' : ''); t.textContent = msg;
  document.body.appendChild(t); setTimeout(function(){ t.remove(); }, err ? 6000 : 3000);
}
function fail(e){ idle(); if(String(e.message).indexOf('SESSION_EXPIRED') < 0) toast(e.message, true); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function safeUrl(u){ return /^https?:\/\//i.test(String(u || '')) ? String(u) : ''; }
function fmt(n){ return n == null || n === '' ? '—' : Number(n).toLocaleString('ja-JP'); }
function delta(v, unit){
  if(v == null) return '<span class="muted">—</span>';
  var cls = v > 0 ? 'up' : v < 0 ? 'down' : 'muted';
  return '<span class="'+cls+'">' + (v > 0 ? '+' : '') + Number(v).toLocaleString('ja-JP') + (unit || '') + '</span>';
}
function month(){ return document.getElementById('monthSel').value; }
function monthJa(m){ return m ? m.slice(0,4) + '年' + Number(m.slice(5,7)) + '月' : ''; }

/* ================= 認証 ================= */
function showLogin(msg){
  S.token = null; store('cc_token', null);
  document.getElementById('appView').classList.add('hidden');
  document.getElementById('loginView').classList.remove('hidden');
  document.getElementById('loginErr').textContent = msg || '';
  idle();
}
document.getElementById('loginForm').addEventListener('submit', function(ev){
  ev.preventDefault();
  var p = document.getElementById('pass');
  busy('ログイン中…');
  api('apiLogin', p.value).then(function(r){
    p.value = ''; S.token = r.token; store('cc_token', r.token); start();
  }).catch(function(e){ idle(); document.getElementById('loginErr').textContent = e.message; });
});
function logout(){ api('apiLogout').catch(function(){}).then(function(){ showLogin(''); }); }

function start(){
  document.getElementById('loginView').classList.add('hidden');
  document.getElementById('appView').classList.remove('hidden');
  var ms = document.getElementById('monthSel');
  if(!ms.value){ var d = new Date(); ms.value = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0'); }
  refresh();
}
document.getElementById('monthSel').addEventListener('change', function(){ S.view === 'client' ? openClient(S.clientId) : refresh(); });

function refresh(){
  busy('読み込み中…');
  return api('apiBootstrap').then(function(b){ S.boot = b; idle(); render(); }).catch(fail);
}
function go(view){ S.view = view; if(view === 'dashboard') refresh(); else render(); window.scrollTo(0,0); }
function render(){
  var m = document.getElementById('main');
  if(S.view === 'dashboard') m.innerHTML = viewDashboard();
  else if(S.view === 'client') { m.innerHTML = viewClient(); afterClient(); }
  else if(S.view === 'settings') m.innerHTML = viewSettings();
  else if(S.view === 'editClient') m.innerHTML = viewEditClient();
}

/* ================= ダッシュボード ================= */
function viewDashboard(){
  var b = S.boot, cs = b.clients;
  var tot = cs.reduce(function(a, c){
    a.f += c.summary.followersEnd; a.g += c.summary.followerGrowth; a.v += c.summary.views; a.p += c.summary.postsPublished; return a;
  }, {f:0,g:0,v:0,p:0});
  var jobs = b.jobs || {};
  var jobMsg = Object.keys(jobs).map(function(k){ return (k === 'collect' ? 'データ取得' : '月次レポート') + '：残り ' + jobs[k].remaining + ' 社をバックグラウンドで処理中'; }).join(' / ');
  var h = '';
  if(jobMsg) h += '<div class="panel small">' + esc(jobMsg) + '（数分後に再読み込みしてください）</div>';
  h += '<div class="tiles">' +
    tile('運用クライアント', cs.filter(function(c){ return c.client.active; }).length + ' 社', '') +
    tile('合計フォロワー', fmt(tot.f), '今月 ' + delta(tot.g)) +
    tile('今月の再生・表示', fmt(tot.v), monthJa(b.month)) +
    tile('今月の投稿数', fmt(tot.p), '4 媒体合計') + '</div>';
  h += '<div class="bar" style="padding:0 0 12px"><h2 style="font-size:16px">クライアント</h2><div class="spacer"></div>' +
       '<button class="btn primary" onclick="editClient()">＋ クライアント追加</button></div>';
  if(!cs.length) h += '<div class="panel muted">まだクライアントが登録されていません。「＋ クライアント追加」から 7 社を登録してください。</div>';
  h += '<div class="cards">' + cs.map(function(c){
    var cl = c.client;
    return '<div class="card" onclick="openClient(\'' + esc(cl.id) + '\')">' +
      '<div style="display:flex;justify-content:space-between;gap:8px"><div><h3>' + esc(cl.name) + '</h3><div class="small muted">' + esc(cl.industry || '') + '</div></div>' +
      (cl.active ? '' : '<span class="badge ng">停止中</span>') + '</div>' +
      '<div class="plats">' + PL.map(function(p){
        var d = c.platforms[p];
        return '<div class="plat"><div class="small muted"><span class="dot ' + p + '"></span>' + PL_LABEL[p] + '</div>' +
          '<div class="n">' + (d ? fmt(d.followersEnd) : '—') + '</div><div class="small">' + (d ? delta(d.followerGrowth) : '') + '</div></div>';
      }).join('') + '</div>' +
      '<div class="small muted" style="margin-top:10px">最終取得: ' + esc(c.lastFetchedAt ? c.lastFetchedAt.replace('T',' ').slice(0,16) : '未取得') + '</div>' +
    '</div>';
  }).join('') + '</div>';
  return h;
}
function tile(k, v, d){ return '<div class="tile"><div class="k">' + k + '</div><div class="v">' + v + '</div><div class="d muted">' + d + '</div></div>'; }

function collectAll(){
  if(!confirm('全クライアントの 4 媒体データを今すぐ取得しますか？（毎朝 6 時にも自動取得されます）')) return;
  busy('全社のデータを取得中…（数分かかることがあります）');
  api('apiCollectAll').then(function(){ idle(); toast('取得しました'); refresh(); }).catch(fail);
}

/* ================= クライアント詳細 ================= */
function openClient(id){
  S.view = 'client'; S.clientId = id;
  busy('読み込み中…');
  api('apiClientDetail', id, month()).then(function(d){ S.detail = d; idle(); render(); }).catch(fail);
}

function viewClient(){
  var d = S.detail, c = d.client, mo = d.monthly;
  var tabs = [['overview','概要'],['posts','投稿'],['audience','視聴者属性'],['report','月次レポート'],['ask','AI に質問'],['manual','手入力'],['info','基本情報・連携']];
  var h = '<div class="bar" style="padding:0 0 8px"><button class="btn small" onclick="go(\'dashboard\')">← 一覧</button>' +
    '<h2 style="font-size:18px">' + esc(c.name) + '</h2><span class="muted small">' + esc(c.industry || '') + '</span><div class="spacer"></div>' +
    '<button class="btn" onclick="collectOne()">この会社のデータ取得</button></div>';
  h += '<div class="tabs">' + tabs.map(function(t){ return '<button class="tab' + (S.tab === t[0] ? ' active' : '') + '" onclick="S.tab=\'' + t[0] + '\';render()">' + t[1] + '</button>'; }).join('') + '</div>';

  if(S.tab === 'overview'){
    h += '<div class="tiles">' + tile('合計フォロワー', fmt(mo.summary.followersEnd), monthJa(mo.month) + ' ' + delta(mo.summary.followerGrowth)) +
      tile('再生・表示', fmt(mo.summary.views), '') + tile('投稿数', fmt(mo.summary.postsPublished), '') + '</div>';
    h += '<div class="panel"><h2>媒体別（' + monthJa(mo.month) + '）</h2><div class="tbl-wrap"><table><tr><th>媒体</th><th class="num">フォロワー</th><th class="num">増減</th><th class="num">前月比</th><th class="num">再生・表示</th><th class="num">前月比</th><th class="num">投稿数</th><th class="num">ER</th></tr>' +
      PL.map(function(p){
        var x = mo.platforms[p];
        if(!x) return '<tr><td><span class="dot ' + p + '"></span>' + PL_LABEL[p] + '</td><td colspan="7" class="muted">データなし</td></tr>';
        var ch = x.change || {};
        return '<tr><td><span class="dot ' + p + '"></span>' + PL_LABEL[p] + '</td><td class="num">' + fmt(x.followersEnd) + '</td><td class="num">' + delta(x.followerGrowth) +
          '</td><td class="num">' + delta(ch.followers, '%') + '</td><td class="num">' + fmt(x.views) + '</td><td class="num">' + delta(ch.views, '%') +
          '</td><td class="num">' + fmt(x.postsPublished) + '</td><td class="num">' + (x.engagementRate == null ? '—' : x.engagementRate + '%') + '</td></tr>';
      }).join('') + '</table></div><p class="small muted" style="margin-top:8px">ER = (いいね+コメント+シェア+保存) ÷ 当月投稿の再生数</p></div>';
    h += '<div class="panel"><h2>フォロワー推移（直近 120 日）</h2><div class="chart-box"><canvas id="chart"></canvas></div></div>';
  }

  if(S.tab === 'posts'){
    h += '<div class="panel"><h2>直近の投稿</h2><div class="tbl-wrap"><table class="posts-tbl"><tr><th>日付</th><th>媒体</th><th>内容</th><th class="num">再生</th><th class="num">いいね</th><th class="num">コメント</th><th class="num">シェア</th><th class="num">保存</th><th>属性</th></tr>' +
      d.recentPosts.map(function(p, pi){
        var pa = (d.postAudience || {})[p.platform + '|' + p.postId];
        return '<tr><td class="small">' + esc(String(p.publishedAt).slice(0,10)) + '</td><td><span class="dot ' + esc(p.platform) + '"></span>' + PL_LABEL[p.platform] + '</td><td class="title">' +
          (safeUrl(p.url) ? '<a href="' + esc(safeUrl(p.url)) + '" target="_blank" rel="noopener">' + esc(p.title || '(無題)') + '</a>' : esc(p.title)) + '</td><td class="num">' + fmt(p.views) +
          '</td><td class="num">' + fmt(p.likes) + '</td><td class="num">' + fmt(p.comments) + '</td><td class="num">' + fmt(p.shares) + '</td><td class="num">' + fmt(p.saves) + '</td>' +
          '<td>' + (pa ? '<button class="btn small" onclick="togglePostAud(' + pi + ')">見る</button>' : '<span class="small muted">—</span>') + '</td></tr>' +
          (pa ? '<tr id="pa' + pi + '" class="aud-row hidden"><td colspan="9"><div class="aud-inner">' + audBlock(pa, p.platform) + '</div></td></tr>' : '');
      }).join('') + '</table></div>' + (d.recentPosts.length ? '' : '<p class="muted">投稿データがありません</p>') +
      '<p class="small muted" style="margin-top:8px">投稿ごとの属性は、YouTube（詳細分析を連携した場合）で取得できます。Instagram の属性はアカウント単位で「視聴者属性」タブに表示されます。</p></div>';
  }

  if(S.tab === 'audience'){
    h += '<p class="small muted" style="margin-bottom:12px">年齢層・性別・フォロワー/フォロワー外の割合（%）です。対象月までの最新データを表示しています。</p><div class="aud-grid">' +
      PL.map(function(p){
        var x = mo.platforms[p], aud = x && x.audience;
        return '<div class="panel aud-card"><h2><span class="dot ' + p + '"></span>' + PL_LABEL[p] + (aud ? ' <span class="small muted">（' + monthJa(aud.month) + ' 時点）</span>' : '') + '</h2>' +
          (aud ? audBlock(aud, p) : '<p class="small muted">' + AUD_HOWTO[p] + '</p>') + '</div>';
      }).join('') + '</div>';
  }

  if(S.tab === 'report'){
    var eng = S.boot.settings.defaultEngine;
    h += '<div class="panel"><h2>' + monthJa(mo.month) + ' の月次レポートを作成</h2>' +
      '<p class="small muted">設定画面の「固定指示」に沿って、ボタン 1 つでクライアント提出用レポートを作成し、Google ドキュメントに保存します。</p>' +
      '<div class="row" style="align-items:end"><div><label>AI エンジン</label><select id="engine">' + engineOptions(eng) + '</select></div>' +
      '<div><button class="btn primary" onclick="genReport()">レポートを作成</button></div></div></div>';
    h += d.reports.map(function(r, i){
      return '<div class="panel"><div class="bar" style="padding:0 0 8px"><b>' + monthJa(r.month) + '</b><span class="badge">' + esc(r.engine) + '</span><span class="small muted">' + esc(String(r.createdAt).replace('T',' ').slice(0,16)) + '</span><div class="spacer"></div>' +
        (safeUrl(r.docUrl) ? '<a class="btn small" href="' + esc(r.docUrl) + '" target="_blank" rel="noopener">Google ドキュメントで開く</a>' : '') +
        '<button class="btn small" onclick="copyReport(' + i + ')">本文をコピー</button>' +
        '<button class="btn small" onclick="toggleReport(' + i + ')">表示/非表示</button></div>' +
        '<div id="rep' + i + '" class="md' + (i ? ' hidden' : '') + '">' + md(r.markdown) + '</div></div>';
    }).join('');
  }

  if(S.tab === 'ask'){
    h += '<div class="panel"><h2>このクライアントについて AI に質問</h2>' +
      '<p class="small muted">' + monthJa(mo.month) + ' のデータをもとに回答します。例：「来月の投稿テーマ案を 5 つ」「YouTube が伸び悩んでいる理由は？」</p>' +
      '<textarea id="q" placeholder="質問を入力"></textarea>' +
      '<div class="row" style="align-items:end;margin-top:8px"><div><label>AI</label><select id="askEngine"><option value="claude">Claude</option><option value="gpt">ChatGPT</option></select></div>' +
      '<div><button class="btn primary" onclick="ask()">質問する</button></div></div><div id="answer" class="md" style="margin-top:14px"></div></div>';
  }

  if(S.tab === 'manual'){
    h += '<div class="panel"><h2>アカウント数値の手入力</h2><p class="small muted">API 未連携の媒体（例：X を API 契約しない場合）は、月末などに数字を入力してください。空欄は保存されません。</p>' +
      '<div class="row"><div><label>媒体</label><select id="mPlat">' + PL.map(function(p){ return '<option value="' + p + '">' + PL_LABEL[p] + '</option>'; }).join('') + '</select></div>' +
      '<div><label>日付</label><input type="date" id="mDate" value="' + new Date().toISOString().slice(0,10) + '"></div>' +
      '<div><label>フォロワー数</label><input type="number" id="mFollowers"></div><div><label>累計投稿数</label><input type="number" id="mPosts"></div>' +
      '<div><label>その日の表示回数/再生数</label><input type="number" id="mViews"></div><div><label>その日のリーチ</label><input type="number" id="mReach"></div></div>' +
      '<button class="btn primary" style="margin-top:12px" onclick="saveManual()">保存</button></div>';
    h += '<div class="panel"><h2>投稿の手入力</h2><div class="row">' +

    return '<span style="flex:' + map[k] + ';background:' + colors[k] + '" title="' + labels[k] + ' ' + pctTxt(map[k]) + '"></span>'; }).join('') + '</div>' +

      return '<span><i style="background:' + colors[k] + '"></i>' + labels[k] + ' <b>' + pctTxt(map[k]) + '</b></span>'; }).join('') + '</div>';

function audBlock(aud, platform){
  var h = '';
  ['viewers','followers','engaged'].forEach(function(basis){
    var b = aud[basis]; if(!b) return;
    var label = platform === 'youtube' && basis === 'viewers' ? '視聴者の属性' : BASIS_LABEL[basis];
    h += '<div class="aud-sub"><b>' + label + '</b></div>';
    if(b.follow){
      h += '<div class="aud-sub">' + (platform === 'youtube' ? 'チャンネル登録者 / 未登録（視聴回数の割合）' : 'フォロワー / フォロワー外（閲覧の割合）') + '</div>' +
        stackBar(b.follow, FOLLOW, platform === 'youtube' ? { follower:'登録者', non_follower:'未登録' } : FOLLOW_LABEL, FOLLOW_COLOR);
    }
    if(b.gender){ h += '<div class="aud-sub">性別</div>' + stackBar(b.gender, GENDER, GENDER_LABEL, GENDER_COLOR); }
    if(b.age){
      var max = Math.max.apply(null, AGE.map(function(k){ return b.age[k] || 0; })) || 1;
      h += '<div class="aud-sub">年齢層</div>' + AGE.filter(function(k){ return b.age[k] != null; }).map(function(k){

      }).join('');

/* ================= Markdown（簡易） ================= */
function inline(s){
  return esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/(https?:\/\/[^\s<)]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
}
function md(src){
  var lines = String(src || '').replace(/\r/g, '').split('\n'), out = [], i = 0, list = null;
  function closeList(){ if(list){ out.push('</' + list + '>'); list = null; } }
  while(i < lines.length){
    var l = lines[i], m;
    if(/^\s*\|/.test(l)){
      closeList();
      var rows = [];
      while(i < lines.length && /^\s*\|/.test(lines[i])){ if(!/^\s*\|[\s:\-|]+\|\s*$/.test(lines[i])) rows.push(lines[i].trim().replace(/^\||\|$/g, '').split('|')); i++; }
      out.push('<div class="tbl-wrap"><table>' + rows.map(function(r, ri){ return '<tr>' + r.map(function(c){ return ri ? '<td>' + inline(c.trim()) + '</td>' : '<th>' + inline(c.trim()) + '</th>'; }).join('') + '</tr>'; }).join('') + '</table></div>');
      continue;
    }
    if((m = /^(#{1,4})\s+(.*)$/.exec(l))){ closeList(); out.push('<h' + m[1].length + '>' + inline(m[2]) + '</h' + m[1].length + '>'); }
    else if((m = /^\s*[-*]\s+(.*)$/.exec(l))){ if(list !== 'ul'){ closeList(); out.push('<ul>'); list = 'ul'; } out.push('<li>' + inline(m[1]) + '</li>'); }
    else if((m = /^\s*\d+[.)]\s+(.*)$/.exec(l))){ if(list !== 'ol'){ closeList(); out.push('<ol>'); list = 'ol'; } out.push('<li>' + inline(m[1]) + '</li>'); }
    else if((m = /^>\s?(.*)$/.exec(l))){ closeList(); out.push('<blockquote>' + inline(m[1]) + '</blockquote>'); }
    else if(/^```/.test(l) || !l.trim()){ closeList(); }
    else { closeList(); out.push('<p>' + inline(l) + '</p>'); }
    i++;
  }
  closeList();
  return out.join('');
}
