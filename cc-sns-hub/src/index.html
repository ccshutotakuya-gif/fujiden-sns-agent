<!DOCTYPE html>
<html lang="ja">
<head>
<base target="_top">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cc SNS Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#F5F6F8;--panel:#FFFFFF;--panel-2:#F0F2F5;--line:#E2E5EA;--ink:#1C2430;--ink-2:#5B6574;--ink-3:#8A93A0;
    --accent:#2754C5;--accent-2:#E8EEFB;--good:#1E8E5A;--bad:#C2410C;--warn:#B7791F;
    --ig:#C13584;--s1:#2754C5;--s2:#C27A1E;--s3:#A0A8B4;--yt:#E02424;--x:#111827;--tt:#00A3B4;
    --radius:10px;--shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0F141B;--panel:#161D26;--panel-2:#1C2531;--line:#2A3442;--ink:#E7ECF2;--ink-2:#A7B1BE;--ink-3:#7A8594;
      --accent:#6E95F5;--accent-2:#1D2A44;--good:#3DBE82;--bad:#F07B4A;--warn:#E3B04B;--x:#E7ECF2;
      --s1:#5B83E8;--s2:#C27F2C;--s3:#4A5563;--shadow:none;color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0F141B;--panel:#161D26;--panel-2:#1C2531;--line:#2A3442;--ink:#E7ECF2;--ink-2:#A7B1BE;--ink-3:#7A8594;
    --accent:#6E95F5;--accent-2:#1D2A44;--good:#3DBE82;--bad:#F07B4A;--warn:#E3B04B;--x:#E7ECF2;
    --s1:#5B83E8;--s2:#C27F2C;--s3:#4A5563;--shadow:none;color-scheme:dark;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:'Noto Sans JP',system-ui,sans-serif;font-size:14px;line-height:1.6}
  button,input,select,textarea{font:inherit;color:inherit}
  a{color:var(--accent)}
  .hidden{display:none!important}

  /* login */
  .login{min-height:100vh;display:grid;place-items:center;padding:16px}
  .login-card{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:32px;box-shadow:var(--shadow)}
  .login-card h1{font-size:20px;margin-bottom:4px}
  .login-card p{color:var(--ink-2);font-size:13px;margin-bottom:20px}

  /* layout */
  header{position:sticky;top:0;z-index:10;background:var(--panel);border-bottom:1px solid var(--line)}
  .bar{max-width:1200px;margin:auto;display:flex;align-items:center;gap:12px;padding:12px 16px;flex-wrap:wrap}
  .logo{font-weight:700;font-size:16px;cursor:pointer}
  .logo span{color:var(--accent)}
  .spacer{flex:1}
  main{max-width:1200px;margin:auto;padding:20px 16px 60px}

  .btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 14px;cursor:pointer;white-space:nowrap}
  .btn:hover{border-color:var(--ink-3)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.small{padding:4px 10px;font-size:12px}
  .btn.danger{color:var(--bad)}
  .btn:disabled{opacity:.5;cursor:wait}
  input,select,textarea{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
  textarea{min-height:90px;resize:vertical}
  label{display:block;font-size:12px;color:var(--ink-2);margin:10px 0 4px}
  .row{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);margin-bottom:16px}
  .panel h2{font-size:15px;margin-bottom:12px}
  .muted{color:var(--ink-2)}
  .small{font-size:12px}

  .tiles{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:16px}
  .tile{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}
  .tile .k{font-size:12px;color:var(--ink-2)}
  .tile .v{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
  .tile .d{font-size:12px}
  .up{color:var(--good)}.down{color:var(--bad)}

  .cards{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;cursor:pointer;box-shadow:var(--shadow);transition:border-color .15s}
  .card:hover{border-color:var(--accent)}
  .card h3{font-size:15px;margin-bottom:2px}
  .plats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}
  .plat{background:var(--panel-2);border-radius:8px;padding:6px 8px}
  .plat .n{font-weight:700;font-variant-numeric:tabular-nums}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
  .dot.instagram{background:var(--ig)}.dot.youtube{background:var(--yt)}.dot.x{background:var(--x)}.dot.tiktok{background:var(--tt)}

  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
  .tab{padding:8px 14px;border:none;background:none;cursor:pointer;color:var(--ink-2);border-bottom:2px solid transparent;white-space:nowrap}
  .tab.active{color:var(--ink);border-bottom-color:var(--accent);font-weight:500}

  .tbl-wrap{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--ink-2);font-weight:500;background:var(--panel-2)}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}

  .md{line-height:1.8}
  .md h1{font-size:20px;margin:6px 0 12px}
  .md h2{font-size:16px;margin:22px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--line)}
  .md h3{font-size:14px;margin:14px 0 6px}
  .md p,.md ul,.md ol{margin:6px 0}
  .md ul,.md ol{padding-left:22px}
  .md table{margin:8px 0}
  .md blockquote{color:var(--ink-2);border-left:3px solid var(--line);padding-left:10px}

  .badge{display:inline-block;font-size:11px;padding:1px 8px;border-radius:999px;background:var(--accent-2);color:var(--accent)}
  .badge.ok{background:rgba(30,142,90,.12);color:var(--good)}
  .badge.ng{background:rgba(194,65,12,.12);color:var(--bad)}

  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:8px;z-index:100;max-width:90vw}
  .toast.err{background:var(--bad);color:#fff}
  .overlay{position:fixed;inset:0;background:rgba(15,20,27,.35);display:grid;place-items:center;z-index:90}
  .overlay .box{background:var(--panel);padding:20px 26px;border-radius:12px;border:1px solid var(--line);text-align:center}
  .spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:s 1s linear infinite;margin:0 auto 10px}
  @keyframes s{to{transform:rotate(360deg)}}
  .secret{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:8px 14px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
  .secret-in{display:flex;gap:8px}
  .secret-name .badge{margin-left:4px}
  .aud-grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
  .aud-card{min-width:0}
  .aud-card h3{font-size:13px;margin-bottom:8px}
  .hbar{display:grid;grid-template-columns:52px minmax(0,1fr) 44px;gap:8px;align-items:center;font-size:12px;margin:3px 0}
  .hbar .track{height:12px;border-radius:0 4px 4px 0;background:var(--panel-2)}
  .hbar .fill{height:100%;background:var(--s1);border-radius:0 4px 4px 0;min-width:2px}
  .hbar .pct{text-align:right;font-variant-numeric:tabular-nums}
  .stack{display:flex;gap:2px;height:16px;margin:4px 0 6px}
  .stack span{display:block;height:100%;min-width:2px}
  .stack span:first-child{border-radius:4px 0 0 4px}.stack span:last-child{border-radius:0 4px 4px 0}
  .legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--ink-2)}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
  .aud-sub{font-size:12px;color:var(--ink-2);margin:12px 0 2px}
  tr.aud-row td{background:var(--panel-2)}
  .tbl-wrap .posts-tbl{min-width:720px}
  .posts-tbl td.title{min-width:180px}
  .aud-inner{max-width:min(440px,calc(100vw - 72px));position:sticky;left:0}
  .aud-inner.form{max-width:min(760px,calc(100vw - 72px))}
  .mini-grid{display:grid;gap:6px 10px;grid-template-columns:repeat(auto-fill,minmax(96px,1fr))}
  .mini-grid label{margin:4px 0 2px}
  .mini-grid input{padding:5px 8px}
  .chart-box{position:relative;height:260px}
  @media (max-width:600px){ .secret{grid-template-columns:1fr} .plats{grid-template-columns:repeat(2,1fr)} .tile .v{font-size:20px} }
</style>
</head>
<body>

<!-- ログイン -->
<section id="loginView" class="login">
  <div class="login-card">
    <h1>Cc SNS Hub</h1>
    <p>Cc 社内専用です。共通パスワードを入力してください。</p>
    <form id="loginForm">
      <input type="password" id="pass" placeholder="パスワード" autocomplete="current-password" required>
      <button class="btn primary" style="width:100%;margin-top:12px" type="submit">ログイン</button>
      <p id="loginErr" class="small" style="color:var(--bad);margin:10px 0 0"></p>
    </form>
  </div>
</section>

<!-- アプリ -->
<div id="appView" class="hidden">
  <header>
    <div class="bar">
      <div class="logo" onclick="go('dashboard')">Cc <span>SNS Hub</span></div>
      <div class="spacer"></div>
      <input type="month" id="monthSel" style="width:auto">
      <button class="btn" onclick="collectAll()">全社データ取得</button>
      <button class="btn" onclick="go('settings')">設定</button>
      <button class="btn" onclick="logout()">ログアウト</button>
    </div>
  </header>
  <main id="main"></main>
</div>

<div id="overlay" class="overlay hidden"><div class="box"><div class="spin"></div><div id="overlayMsg">処理中…</div></div></div>

<script>
/* ================= 基本 ================= */
var PL = ['instagram','youtube','x','tiktok'];
var PL_LABEL = {instagram:'Instagram',youtube:'YouTube',x:'X',tiktok:'TikTok'};
var S = { token:null, boot:null, view:'dashboard', clientId:null, detail:null, tab:'overview', chart:null };

function store(k, v){ try{ if(v===undefined) return sessionStorage.getItem(k); if(v===null) sessionStorage.removeItem(k); else sessionStorage.setItem(k, v); }catch(e){ return null; } }

/** google.script.run を Promise 化（トークン自動付与・セッション切れ処理） */
function api(fn){
  var args = Array.prototype.slice.call(arguments, 1);
  return new Promise(function(resolve, reject){
    var r = google.script.run.withSuccessHandler(resolve).withFailureHandler(function(e){
      var msg = (e && e.message) || String(e);
      if(msg.indexOf('SESSION_EXPIRED') >= 0){ showLogin('セッションの有効期限が切れました。再ログインしてください。'); }
      reject(new Error(msg));
    });
    r[fn].apply(r, fn === 'apiLogin' ? args : [S.token].concat(args));
  });
}

function busy(msg){ document.getElementById('overlayMsg').textContent = msg || '処理中…'; document.getElementById('overlay').classList.remove('hidden'); }
function idle(){ document.getElementById('overlay').classList.add('hidden'); }
function toast(msg, err){
  var t = document.createElement('div'); t.className = 'toast' + (err ? ' err' : ''); t.textContent = msg;
  document.body.appendChild(t); setTimeout(function(){ t.remove(); }, err ? 6000 : 3000);
}
function fail(e){ idle(); if(String(e.message).indexOf('SESSION_EXPIRED') < 0) toast(e.message, true); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function safeUrl(u){ return /^https?:\/\//i.test(String(u || '')) ? String(u) : ''; }
function fmt(n){ return n == null || n === '' ? '—' : Number(n).toLocaleString('ja-JP'); }
function delta(v, unit){
  if(v == null) return '<span class="muted">—</span>';
  var cls = v > 0 ? 'up' : v < 0 ? 'down' : 'muted';
  return '<span class="'+cls+'">' + (v > 0 ? '+' : '') + Number(v).toLocaleString('ja-JP') + (unit || '') + '</span>';
}
function month(){ return document.getElementById('monthSel').value; }
function monthJa(m){ return m ? m.slice(0,4) + '年' + Number(m.slice(5,7)) + '月' : ''; }

/* ================= 認証 ================= */
function showLogin(msg){
  S.token = null; store('cc_token', null);
  document.getElementById('appView').classList.add('hidden');
  document.getElementById('loginView').classList.remove('hidden');
  document.getElementById('loginErr').textContent = msg || '';
  idle();
}
document.getElementById('loginForm').addEventListener('submit', function(ev){
  ev.preventDefault();
  var p = document.getElementById('pass');
  busy('ログイン中…');
  api('apiLogin', p.value).then(function(r){
    p.value = ''; S.token = r.token; store('cc_token', r.token); start();
  }).catch(function(e){ idle(); document.getElementById('loginErr').textContent = e.message; });
});
function logout(){ api('apiLogout').catch(function(){}).then(function(){ showLogin(''); }); }

function start(){
  document.getElementById('loginView').classList.add('hidden');
  document.getElementById('appView').classList.remove('hidden');
  var ms = document.getElementById('monthSel');
  if(!ms.value){ var d = new Date(); ms.value = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0'); }
  refresh();
}
document.getElementById('monthSel').addEventListener('change', function(){ S.view === 'client' ? openClient(S.clientId) : refresh(); });

function refresh(){
  busy('読み込み中…');
  return api('apiBootstrap').then(function(b){ S.boot = b; idle(); render(); }).catch(fail);
}
function go(view){ S.view = view; if(view === 'dashboard') refresh(); else render(); window.scrollTo(0,0); }
function render(){
  var m = document.getElementById('main');
  if(S.view === 'dashboard') m.innerHTML = viewDashboard();
  else if(S.view === 'client') { m.innerHTML = viewClient(); afterClient(); }
  else if(S.view === 'settings') m.innerHTML = viewSettings();
  else if(S.view === 'editClient') m.innerHTML = viewEditClient();
}

/* ================= ダッシュボード ================= */
function viewDashboard(){
  var b = S.boot, cs = b.clients;
  var tot = cs.reduce(function(a, c){
    a.f += c.summary.followersEnd; a.g += c.summary.followerGrowth; a.v += c.summary.views; a.p += c.summary.postsPublished; return a;
  }, {f:0,g:0,v:0,p:0});
  var jobs = b.jobs || {};
  var jobMsg = Object.keys(jobs).map(function(k){ return (k === 'collect' ? 'データ取得' : '月次レポート') + '：残り ' + jobs[k].remaining + ' 社をバックグラウンドで処理中'; }).join(' / ');
  var h = '';
  if(jobMsg) h += '<div class="panel small">' + esc(jobMsg) + '（数分後に再読み込みしてください）</div>';
  h += '<div class="tiles">' +
    tile('運用クライアント', cs.filter(function(c){ return c.client.active; }).length + ' 社', '') +
    tile('合計フォロワー', fmt(tot.f), '今月 ' + delta(tot.g)) +
    tile('今月の再生・表示', fmt(tot.v), monthJa(b.month)) +
    tile('今月の投稿数', fmt(tot.p), '4 媒体合計') + '</div>';
  h += '<div class="bar" style="padding:0 0 12px"><h2 style="font-size:16px">クライアント</h2><div class="spacer"></div>' +
       '<button class="btn primary" onclick="editClient()">＋ クライアント追加</button></div>';
  if(!cs.length) h += '<div class="panel muted">まだクライアントが登録されていません。「＋ クライアント追加」から 7 社を登録してください。</div>';
  h += '<div class="cards">' + cs.map(function(c){
    var cl = c.client;
    return '<div class="card" onclick="openClient(\'' + esc(cl.id) + '\')">' +
      '<div style="display:flex;justify-content:space-between;gap:8px"><div><h3>' + esc(cl.name) + '</h3><div class="small muted">' + esc(cl.industry || '') + '</div></div>' +
      (cl.active ? '' : '<span class="badge ng">停止中</span>') + '</div>' +
      '<div class="plats">' + PL.map(function(p){
        var d = c.platforms[p];
        return '<div class="plat"><div class="small muted"><span class="dot ' + p + '"></span>' + PL_LABEL[p] + '</div>' +
          '<div class="n">' + (d ? fmt(d.followersEnd) : '—') + '</div><div class="small">' + (d ? delta(d.followerGrowth) : '') + '</div></div>';
      }).join('') + '</div>' +
      '<div class="small muted" style="margin-top:10px">最終取得: ' + esc(c.lastFetchedAt ? c.lastFetchedAt.replace('T',' ').slice(0,16) : '未取得') + '</div>' +
    '</div>';
  }).join('') + '</div>';
  return h;
}
function tile(k, v, d){ return '<div class="tile"><div class="k">' + k + '</div><div class="v">' + v + '</div><div class="d muted">' + d + '</div></div>'; }

function collectAll(){
  if(!confirm('全クライアントの 4 媒体データを今すぐ取得しますか？（毎朝 6 時にも自動取得されます）')) return;
  busy('全社のデータを取得中…（数分かかることがあります）');
  api('apiCollectAll').then(function(){ idle(); toast('取得しました'); refresh(); }).catch(fail);
}

/* ================= クライアント詳細 ================= */
function openClient(id){
  S.view = 'client'; S.clientId = id;
  busy('読み込み中…');
  api('apiClientDetail', id, month()).then(function(d){ S.detail = d; idle(); render(); }).catch(fail);
}

function viewClient(){
  var d = S.detail, c = d.client, mo = d.monthly;
  var tabs = [['overview','概要'],['posts','投稿'],['audience','視聴者属性'],['report','月次レポート'],['ask','AI に質問'],['manual','手入力'],['info','基本情報・連携']];
  var h = '<div class="bar" style="padding:0 0 8px"><button class="btn small" onclick="go(\'dashboard\')">← 一覧</button>' +
    '<h2 style="font-size:18px">' + esc(c.name) + '</h2><span class="muted small">' + esc(c.industry || '') + '</span><div class="spacer"></div>' +
    '<button class="btn" onclick="collectOne()">この会社のデータ取得</button></div>';
  h += '<div class="tabs">' + tabs.map(function(t){ return '<button class="tab' + (S.tab === t[0] ? ' active' : '') + '" onclick="S.tab=\'' + t[0] + '\';render()">' + t[1] + '</button>'; }).join('') + '</div>';

  if(S.tab === 'overview'){
    h += '<div class="tiles">' + tile('合計フォロワー', fmt(mo.summary.followersEnd), monthJa(mo.month) + ' ' + delta(mo.summary.followerGrowth)) +
      tile('再生・表示', fmt(mo.summary.views), '') + tile('投稿数', fmt(mo.summary.postsPublished), '') + '</div>';
    h += '<div class="panel"><h2>媒体別（' + monthJa(mo.month) + '）</h2><div class="tbl-wrap"><table><tr><th>媒体</th><th class="num">フォロワー</th><th class="num">増減</th><th class="num">前月比</th><th class="num">再生・表示</th><th class="num">前月比</th><th class="num">投稿数</th><th class="num">ER</th></tr>' +
      PL.map(function(p){
        var x = mo.platforms[p];
        if(!x) return '<tr><td><span class="dot ' + p + '"></span>' + PL_LABEL[p] + '</td><td colspan="7" class="muted">データなし</td></tr>';
        var ch = x.change || {};
        return '<tr><td><span class="dot ' + p + '"></span>' + PL_LABEL[p] + '</td><td class="num">' + fmt(x.followersEnd) + '</td><td class="num">' + delta(x.followerGrowth) +
          '</td><td class="num">' + delta(ch.followers, '%') + '</td><td class="num">' + fmt(x.views) + '</td><td class="num">' + delta(ch.views, '%') +
          '</td><td class="num">' + fmt(x.postsPublished) + '</td><td class="num">' + (x.engagementRate == null ? '—' : x.engagementRate + '%') + '</td></tr>';
      }).join('') + '</table></div><p class="small muted" style="margin-top:8px">ER = (いいね+コメント+シェア+保存) ÷ 当月投稿の再生数</p></div>';
    h += '<div class="panel"><h2>フォロワー推移（直近 120 日）</h2><div class="chart-box"><canvas id="chart"></canvas></div></div>';
  }

  if(S.tab === 'posts'){
    h += '<div class="panel"><h2>直近の投稿</h2><div class="tbl-wrap"><table class="posts-tbl"><tr><th>日付</th><th>媒体</th><th>内容</th><th class="num">再生</th><th class="num">いいね</th><th class="num">コメント</th><th class="num">シェア</th><th class="num">保存</th><th>属性</th></tr>' +
      d.recentPosts.map(function(p, pi){
        var pa = (d.postAudience || {})[p.platform + '|' + p.postId];
        return '<tr><td class="small">' + esc(String(p.publishedAt).slice(0,10)) + '</td><td><span class="dot ' + esc(p.platform) + '"></span>' + PL_LABEL[p.platform] + '</td><td class="title">' +

function afterClient(){
  if(S.tab !== 'overview' || !window.Chart) return;
  var el = document.getElementById('chart'); if(!el) return;
  if(S.chart){ S.chart.destroy(); S.chart = null; }
  var css = getComputedStyle(document.documentElement);
  var col = {instagram:css.getPropertyValue('--ig'), youtube:css.getPropertyValue('--yt'), x:css.getPropertyValue('--x'), tiktok:css.getPropertyValue('--tt')};
  var series = S.detail.series;
  var ds = PL.filter(function(p){ return series[p]; }).map(function(p){
    return { label: PL_LABEL[p], data: series[p].map(function(r){ return {x: r.date, y: r.followers}; }), borderColor: col[p].trim(), backgroundColor: col[p].trim(), tension:.25, pointRadius:0, borderWidth:2 };
  });
  S.chart = new Chart(el, { type:'line', data:{datasets:ds}, options:{ maintainAspectRatio:false, parsing:true,
    scales:{ x:{type:'category', labels: uniqueDates(series), ticks:{maxTicksLimit:8, color:css.getPropertyValue('--ink-2')}, grid:{display:false}},
             y:{ticks:{color:css.getPropertyValue('--ink-2')}, grid:{color:css.getPropertyValue('--line')}} },
    plugins:{ legend:{labels:{color:css.getPropertyValue('--ink-2'), boxWidth:10}} }, interaction:{mode:'index', intersect:false} } });
}
function uniqueDates(series){ var s = {}; Object.keys(series).forEach(function(p){ series[p].forEach(function(r){ s[r.date] = 1; }); }); return Object.keys(s).sort(); }

/* ---------- 視聴者属性 ---------- */
var AGE = ['13-17','18-24','25-34','35-44','45-54','55-64','65+'];
var GENDER = ['female','male','unknown'];
var GENDER_LABEL = { female:'女性', male:'男性', unknown:'その他・不明' };
var GENDER_COLOR = { female:'var(--s2)', male:'var(--s1)', unknown:'var(--s3)' };
var FOLLOW = ['follower','non_follower'];
var FOLLOW_LABEL = { follower:'フォロワー', non_follower:'フォロワー外' };
var FOLLOW_COLOR = { follower:'var(--s1)', non_follower:'var(--s2)' };
var BASIS_LABEL = { followers:'フォロワーの属性', viewers:'視聴者の属性', engaged:'反応した人の属性' };
var AUD_HOWTO = {
  instagram:'毎朝のデータ取得で自動取得されます（フォロワー 100 人以上が条件）。まだ取得されていません。',
  youtube:'「基本情報・連携」タブで「YouTube 詳細分析を連携」すると自動取得されます。',
  x:'X の API では属性が取得できません。「手入力」タブから入力してください。',
  tiktok:'TikTok の API では属性が取得できません。TikTok アプリの分析画面の % を「手入力」タブから入力してください。'
};
function pctTxt(v){ return v == null ? '—' : (Math.round(v * 10) / 10) + '%'; }
function stackBar(map, keys, labels, colors){
  var segs = keys.filter(function(k){ return map[k] > 0; });
  return '<div class="stack">' + segs.map(function(k){
    return '<span style="flex:' + map[k] + ';background:' + colors[k] + '" title="' + labels[k] + ' ' + pctTxt(map[k]) + '"></span>'; }).join('') + '</div>' +
    '<div class="legend">' + keys.filter(function(k){ return map[k] != null; }).map(function(k){
      return '<span><i style="background:' + colors[k] + '"></i>' + labels[k] + ' <b>' + pctTxt(map[k]) + '</b></span>'; }).join('') + '</div>';
}
function audBlock(aud, platform){
  var h = '';
  ['viewers','followers','engaged'].forEach(function(basis){
    var b = aud[basis]; if(!b) return;
    var label = platform === 'youtube' && basis === 'viewers' ? '視聴者の属性' : BASIS_LABEL[basis];
    h += '<div class="aud-sub"><b>' + label + '</b></div>';
    if(b.follow){
      h += '<div class="aud-sub">' + (platform === 'youtube' ? 'チャンネル登録者 / 未登録（視聴回数の割合）' : 'フォロワー / フォロワー外（閲覧の割合）') + '</div>' +
        stackBar(b.follow, FOLLOW, platform === 'youtube' ? { follower:'登録者', non_follower:'未登録' } : FOLLOW_LABEL, FOLLOW_COLOR);
    }
    if(b.gender){ h += '<div class="aud-sub">性別</div>' + stackBar(b.gender, GENDER, GENDER_LABEL, GENDER_COLOR); }
    if(b.age){
      var max = Math.max.apply(null, AGE.map(function(k){ return b.age[k] || 0; })) || 1;
      h += '<div class="aud-sub">年齢層</div>' + AGE.filter(function(k){ return b.age[k] != null; }).map(function(k){
        return '<div class="hbar" title="' + k + ' 歳 ' + pctTxt(b.age[k]) + '"><span>' + k + '</span><div class="track"><div class="fill" style="width:' + (b.age[k] / max * 100) + '%"></div></div><span class="pct">' + pctTxt(b.age[k]) + '</span></div>';
      }).join('');
    }
  });
  return h || '<p class="small muted">データがありません</p>';
}
function postAudForm(pi, p, pa){
  var v = (pa && pa.viewers) || {};
  function inp(id, label, cur){ return '<div><label>' + label + '</label><input type="number" step="0.1" id="' + id + '" value="' + (cur == null ? '' : esc(cur)) + '"></div>'; }
  var hint = p.platform === 'instagram' ? 'Instagram アプリ：投稿 →「インサイトを見る」→「閲覧数」のフォロワー / フォロワー以外の %'
    : p.platform === 'tiktok' ? 'TikTok アプリ：動画 →「アナリティクス」→「視聴者」の性別・年齢の %' : '各アプリの投稿分析の %';
  return '<p class="small muted">' + hint + '（空欄は保存されません）</p>' +
    '<div class="aud-sub">フォロワー / フォロワー外（閲覧の %）</div><div class="mini-grid">' +
      FOLLOW.map(function(k){ return inp('pf' + pi + '_' + k, FOLLOW_LABEL[k], (v.follow || {})[k]); }).join('') + '</div>' +
    '<div class="aud-sub">性別（%）</div><div class="mini-grid">' +
      GENDER.map(function(k){ return inp('pg' + pi + '_' + k, GENDER_LABEL[k], (v.gender || {})[k]); }).join('') + '</div>' +
    '<div class="aud-sub">年齢層（%）</div><div class="mini-grid">' +
      AGE.map(function(k, i){ return inp('pa' + pi + '_' + i, k + ' 歳', (v.age || {})[k]); }).join('') + '</div>' +
    '<button class="btn primary small" style="margin-top:10px" onclick="savePostAudience(' + pi + ')">この投稿の属性を保存</button>';
}

    t('goal','SNS 運用の目的','例：採用応募を増やす（特に 20 代の技術職）、指名検索を増やす') +
    t('kpi','KPI（目標数値）','例：Instagram フォロワー 月 +150、YouTube 月間再生 2 万回、採用ページ遷移 月 50 件') +
    '<div class="row">' + f('tone','レポートのトーン','丁寧・前向き・数字重視 など') + '<div><label>状態</label><select id="f_active"><option value="true"' + (c.active ? ' selected' : '') + '>運用中</option><option value="false"' + (c.active ? '' : ' selected') + '>停止中</option></select></div></div>' +
    t('notes','補足（担当者名・NG 事項・今月のトピックなど）','') + '</div>' +
    '<div class="panel"><h2>アカウント連携</h2><div class="row">' +
    f('ig_user_id','Instagram ビジネスアカウント ID','17841400000000000') +
    f('yt_channel_id','YouTube チャンネル ID または @ハンドル','UCxxxx… / @example') +
    f('x_username','X ユーザー名','@example') + '</div>' +
    '<p class="small muted" style="margin-top:8px">TikTok は保存後、「基本情報・連携」タブの「TikTok を連携」から接続します。</p></div>' +
    '<button class="btn primary" onclick="saveClient()">保存</button>';
}
function saveClient(){
  var keys = ['name','industry','goal','kpi','tone','notes','ig_user_id','yt_channel_id','x_username'];
  var o = { id: EDIT.id };
  keys.forEach(function(k){ o[k] = val('f_' + k).trim(); });
  o.active = val('f_active') === 'true';
  if(!o.name) return toast('会社名を入力してください', true);
  busy('保存中…');
  api('apiSaveClient', o).then(function(c){ idle(); toast('保存しました'); S.tab = 'overview'; openClient(c.id); }).catch(fail);
}

/* ================= 設定 ================= */
var SECRET_LABELS = {
  ANTHROPIC_API_KEY:'Claude（Anthropic）API キー', OPENAI_API_KEY:'ChatGPT（OpenAI）API キー',
  META_ACCESS_TOKEN:'Meta（Instagram）アクセストークン', YOUTUBE_API_KEY:'YouTube Data API キー',
  X_BEARER_TOKEN:'X API Bearer Token（任意・従量課金）', TIKTOK_CLIENT_KEY:'TikTok Client Key', TIKTOK_CLIENT_SECRET:'TikTok Client Secret',
  GOOGLE_OAUTH_CLIENT_ID:'Google OAuth クライアント ID（YouTube 詳細分析）', GOOGLE_OAUTH_CLIENT_SECRET:'Google OAuth クライアント シークレット'
};
function viewSettings(){
  var s = S.boot.settings;
  var h = '<div class="bar" style="padding:0 0 12px"><button class="btn small" onclick="go(\'dashboard\')">← 一覧</button><h2 style="font-size:18px">設定</h2></div>';
  h += '<div class="panel"><h2>レポート設定</h2><div class="row">' +
    '<div><label>報告元（会社名）</label><input id="s_agencyName" value="' + esc(s.agencyName) + '"></div>' +
    '<div><label>既定の AI エンジン</label><select id="s_defaultEngine">' + engineOptions(s.defaultEngine) + '</select></div>' +
    '<div><label>Claude モデル</label><input id="s_claudeModel" value="' + esc(s.claudeModel) + '"></div>' +
    '<div><label>ChatGPT モデル</label><input id="s_openaiModel" value="' + esc(s.openaiModel) + '"></div>' +
    '<div><label>月初の自動レポート作成</label><select id="s_autoMonthlyReport"><option value="true"' + (s.autoMonthlyReport ? ' selected' : '') + '>オン（毎月 1 日 8 時に前月分を全社作成）</option><option value="false"' + (s.autoMonthlyReport ? '' : ' selected') + '>オフ</option></select></div>' +
    '<div><label>完了通知メール</label><input id="s_notifyEmail" type="email" value="' + esc(s.notifyEmail) + '" placeholder="sns@example.com"></div></div>' +
    '<label>固定指示（すべてのクライアントの月次レポートはこの指示で作成されます）</label><textarea id="s_reportInstruction" style="min-height:320px;font-size:13px">' + esc(s.reportInstruction) + '</textarea>' +
    '<div style="display:flex;gap:8px;margin-top:12px"><button class="btn primary" onclick="saveSettings()">保存</button><button class="btn" onclick="resetInstruction()">指示を初期値に戻す</button></div></div>';
  h += '<div class="panel"><h2>API キー・連携</h2><p class="small muted">キーはサーバー側（Script Properties）にのみ保存され、画面には表示されません。空欄で保存すると削除します。</p>' +
    Object.keys(SECRET_LABELS).map(function(k){
      return '<div class="secret"><div class="secret-name">' + SECRET_LABELS[k] + ' ' + (s.keys[k] ? '<span class="badge ok">登録済み</span>' : '<span class="badge ng">未登録</span>') +
        '</div><div class="secret-in"><input type="password" id="k_' + k + '" placeholder="新しい値を入力" autocomplete="off"><button class="btn small" onclick="saveSecret(\'' + k + '\')">保存</button></div></div>';
    }).join('') +
    '<p class="small muted" style="margin-top:10px">TikTok アプリ・Google OAuth クライアントのリダイレクト URI に登録する URL：<br><code style="word-break:break-all">' + esc(s.redirectUri) + '</code></p>' +
    '<div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap"><button class="btn" onclick="testAi(\'claude\')">Claude 接続テスト</button><button class="btn" onclick="testAi(\'gpt\')">ChatGPT 接続テスト</button><button class="btn" onclick="showLogs()">エラーログ</button></div><div id="logs"></div></div>';
  h += '<div class="panel"><h2>共通パスワードの変更</h2><p class="small muted">変更すると全員がログアウトされます。新しいパスワードを社内に共有してください。</p><div class="row">' +
    '<div><label>現在のパスワード</label><input type="password" id="pw0"></div><div><label>新しいパスワード（8 文字以上）</label><input type="password" id="pw1"></div><div><label>新しいパスワード（確認）</label><input type="password" id="pw2"></div></div>' +
    '<button class="btn" style="margin-top:12px" onclick="changePw()">変更</button></div>';
  return h;
}
function saveSettings(patch){
  patch = patch || { agencyName:val('s_agencyName'), defaultEngine:val('s_defaultEngine'), claudeModel:val('s_claudeModel'), openaiModel:val('s_openaiModel'),
    autoMonthlyReport: val('s_autoMonthlyReport') === 'true', notifyEmail:val('s_notifyEmail'), reportInstruction:val('s_reportInstruction') };
  busy('保存中…');
  api('apiSaveSettings', patch).then(function(s){ idle(); S.boot.settings = s; toast('保存しました'); render(); }).catch(fail);
}
function resetInstruction(){ if(confirm('固定指示を初期値に戻しますか？')) saveSettings({ reportInstruction:'' }); }
function saveSecret(k){
  var v = val('k_' + k).trim();
  if(!v && !confirm(SECRET_LABELS[k] + ' を削除しますか？')) return;
  api('apiSaveSecret', k, v).then(function(s){ S.boot.settings = s; toast('保存しました'); render(); }).catch(fail);
}
function testAi(engine){
  busy('接続テスト中…');
  api('apiTestAi', engine).then(function(r){ idle(); toast('応答: ' + r.slice(0, 60)); }).catch(fail);
}
function showLogs(){
  api('apiLogs').then(function(rows){
    document.getElementById('logs').innerHTML = '<div class="tbl-wrap" style="margin-top:12px;max-height:320px;overflow:auto"><table>' +
      rows.map(function(r){ return '<tr><td class="small">' + esc(String(r.at).replace('T',' ')) + '</td><td>' + esc(r.level) + '</td><td>' + esc(r.scope) + '</td><td>' + esc(r.message) + '</td></tr>'; }).join('') +
      '</table></div>' + (rows.length ? '' : '<p class="muted small" style="margin-top:8px">ログはありません</p>');
  }).catch(fail);
}
function changePw(){
  if(val('pw1') !== val('pw2')) return toast('確認用パスワードが一致しません', true);
  api('apiChangePassword', val('pw0'), val('pw1')).then(function(){ showLogin('パスワードを変更しました。新しいパスワードでログインしてください。'); }).catch(fail);
}

/* ================= Markdown（簡易） ================= */
function inline(s){
  return esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/(https?:\/\/[^\s<)]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
}
function md(src){
  var lines = String(src || '').replace(/\r/g, '').split('\n'), out = [], i = 0, list = null;
  function closeList(){ if(list){ out.push('</' + list + '>'); list = null; } }
  while(i < lines.length){
    var l = lines[i], m;
    if(/^\s*\|/.test(l)){
      closeList();
      var rows = [];
      while(i < lines.length && /^\s*\|/.test(lines[i])){ if(!/^\s*\|[\s:\-|]+\|\s*$/.test(lines[i])) rows.push(lines[i].trim().replace(/^\||\|$/g, '').split('|')); i++; }
      out.push('<div class="tbl-wrap"><table>' + rows.map(function(r, ri){ return '<tr>' + r.map(function(c){ return ri ? '<td>' + inline(c.trim()) + '</td>' : '<th>' + inline(c.trim()) + '</th>'; }).join('') + '</tr>'; }).join('') + '</table></div>');
      continue;
    }
    if((m = /^(#{1,4})\s+(.*)$/.exec(l))){ closeList(); out.push('<h' + m[1].length + '>' + inline(m[2]) + '</h' + m[1].length + '>'); }
    else if((m = /^\s*[-*]\s+(.*)$/.exec(l))){ if(list !== 'ul'){ closeList(); out.push('<ul>'); list = 'ul'; } out.push('<li>' + inline(m[1]) + '</li>'); }
    else if((m = /^\s*\d+[.)]\s+(.*)$/.exec(l))){ if(list !== 'ol'){ closeList(); out.push('<ol>'); list = 'ol'; } out.push('<li>' + inline(m[1]) + '</li>'); }
    else if((m = /^>\s?(.*)$/.exec(l))){ closeList(); out.push('<blockquote>' + inline(m[1]) + '</blockquote>'); }
    else if(/^```/.test(l) || !l.trim()){ closeList(); }
    else { closeList(); out.push('<p>' + inline(l) + '</p>'); }
    i++;
  }
  closeList();
  return out.join('');
}

(function(){
  var t = store('cc_token');
  if(t){ S.token = t; start(); }
})();
